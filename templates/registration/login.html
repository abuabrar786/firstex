{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
<p class="muted">Sign in to manage your cart and orders.</p>
<form method="post" style="max-width:440px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Login</button>
</form>
<p>Don't have an account? <a href="{% url 'register' %}">Create one</a>.</p>
{% endblock %}
